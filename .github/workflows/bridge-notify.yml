# Install as .github/workflows/bridge-notify.yml in the CUSTOMER repository.
name: Notify bridge
on:
  push:
    branches: [v2-standalone-customer] # Match the configured customer branch.
permissions: {}
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Request authoritative customer fetch
        env:
          GH_TOKEN: ${{ secrets.BRIDGE_DISPATCH_TOKEN }}
          BRIDGE_REPOSITORY: 00nvogel/SanitizerBridge
          BRIDGE_REF: main
          BRIDGE_PROJECT: v2
        run: |
          gh api --method POST "repos/$BRIDGE_REPOSITORY/actions/workflows/bridge.yml/dispatches" \
            -f ref="$BRIDGE_REF" -f 'inputs[operation]=notification' -f "inputs[project]=$BRIDGE_PROJECT"
